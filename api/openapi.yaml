# Passo 5: especificação OpenAPI da API (Swagger UI em http://localhost:3000/api-docs)
openapi: 3.0.3
info:
  title: Do Campo à Mesa API
  version: 0.2.0
  description: API REST do mercado digital de produtores locais do Alto Minho.
servers:
  - url: http://localhost:3000/api
tags:
  - name: Autenticação
  - name: Produtos
paths:
  /auth/registo:
    post:
      tags: [Autenticação]
      summary: Registar comprador ou produtor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Registo' }
      responses:
        '201': { description: Conta criada }
        '400': { description: Dados inválidos }
        '409': { description: Já existe uma conta com este email }
  /auth/login:
    post:
      tags: [Autenticação]
      summary: Entrar e obter o token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Login' }
      responses:
        '200':
          description: Token e dados do utilizador
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespostaLogin' }
        '401': { description: Email ou password incorretos }
  /auth/eu:
    get:
      tags: [Autenticação]
      summary: Dados do utilizador autenticado
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Utilizador
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Utilizador' }
        '401': { description: Token em falta ou inválido }
  /products:
    get:
      tags: [Produtos]
      summary: Pesquisar produtos
      parameters:
        - { name: q, in: query, description: Texto no nome, schema: { type: string } }
        - { name: categoria, in: query, schema: { type: string } }
        - { name: precoMax, in: query, schema: { type: number } }
        - { name: bio, in: query, schema: { type: boolean } }
        - { name: epoca, in: query, description: 'Uma ou mais épocas separadas por vírgula (ex. Outono,Inverno)', schema: { type: string } }
        - { name: produtor, in: query, description: Id do produtor, schema: { type: string } }
        - { name: ordem, in: query, schema: { type: string, enum: [nome, preco, '-preco', recentes] } }
      responses:
        '200':
          description: Lista de produtos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }
    post:
      tags: [Produtos]
      summary: Criar produto (produtor)
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201': { description: Produto criado (cabeçalho Location com o endereço do novo produto) }
        '400': { description: Dados inválidos }
        '401': { description: Token em falta ou inválido }
        '403': { description: Utilizador não é produtor }
  /products/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Produtos]
      summary: Detalhe de um produto
      responses:
        '200':
          description: Produto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { description: Identificador inválido }
        '404': { description: Não encontrado }
    put:
      tags: [Produtos]
      summary: Atualizar produto (só o produtor dono)
      security: [ { bearerAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200': { description: Produto atualizado }
        '400': { description: Dados inválidos }
        '401': { description: Token em falta ou inválido }
        '404': { description: Não encontrado (ou não pertence a este produtor) }
    delete:
      tags: [Produtos]
      summary: Remover produto (só o produtor dono)
      security: [ { bearerAuth: [] } ]
      responses:
        '204': { description: Removido }
        '401': { description: Token em falta ou inválido }
        '404': { description: Não encontrado (ou não pertence a este produtor) }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Erro:
      type: object
      properties:
        erro: { type: string, example: Produto não encontrado }
    Login:
      type: object
      required: [email, password]
      properties:
        email: { type: string, example: horta@exemplo.pt }
        password: { type: string, example: password123 }
    Registo:
      type: object
      required: [nome, email, password]
      properties:
        nome: { type: string, example: Quinta do Vale }
        email: { type: string, example: quinta@exemplo.pt }
        password: { type: string, minLength: 8, example: password123 }
        papel: { type: string, enum: [comprador, produtor], example: produtor }
        produtor:
          type: object
          properties:
            nomeExploracao: { type: string, example: Quinta do Vale }
            localidade: { type: string, example: Caminha }
            descricao: { type: string, example: Hortícolas biológicos junto ao rio Minho. }
    Utilizador:
      type: object
      properties:
        _id: { type: string }
        nome: { type: string }
        email: { type: string }
        papel: { type: string, enum: [comprador, produtor, admin] }
    RespostaLogin:
      type: object
      properties:
        token: { type: string, description: JWT a enviar no cabeçalho Authorization (Bearer) }
        utilizador: { $ref: '#/components/schemas/Utilizador' }
    ProductInput:
      type: object
      required: [nome, categoria, preco]
      properties:
        nome: { type: string, example: Castanha longal }
        categoria: { type: string, enum: [Hortícolas, Fruta, Mel, Vinho, Queijo, Padaria, Outros], example: Outros }
        preco: { type: number, example: 4.5 }
        unidade: { type: string, example: kg }
        stock: { type: integer, example: 120 }
        biologico: { type: boolean, example: false }
        epocas:
          type: array
          items: { type: string, enum: [Primavera, Verão, Outono, Inverno] }
          example: [Outono]
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          properties:
            _id: { type: string }
            produtor: { type: object, description: Produtor (nome e localidade) }
            imagemUrl: { type: string }