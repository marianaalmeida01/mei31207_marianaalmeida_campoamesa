# Passo 5: especificação OpenAPI da API (Swagger UI em http://localhost:3000/api-docs)
openapi: 3.0.3
info:
  title: Do Campo à Mesa API
  version: 0.3.0
  description: API REST do mercado digital de produtores locais do Alto Minho.
servers:
  - url: http://localhost:3000/api
tags:
  - name: Autenticação
  - name: Produtos
  - name: Produtores
  - name: Encomendas
paths:
  /auth/registo:
    post:
      tags: [Autenticação]
      summary: Registar comprador ou produtor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Registo' }
      responses:
        '201': { description: Conta criada }
        '400': { description: Dados inválidos }
        '409': { description: Já existe uma conta com este email }
  /auth/login:
    post:
      tags: [Autenticação]
      summary: Entrar e obter o token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Login' }
      responses:
        '200':
          description: Token e dados do utilizador
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespostaLogin' }
        '401': { description: Email ou password incorretos }
  /auth/eu:
    get:
      tags: [Autenticação]
      summary: Dados do utilizador autenticado
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Utilizador
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Utilizador' }
        '401': { description: Token em falta ou inválido }
  /products:
    get:
      tags: [Produtos]
      summary: Pesquisar produtos
      parameters:
        - { name: q, in: query, description: Texto no nome, schema: { type: string } }
        - { name: categoria, in: query, schema: { type: string } }
        - { name: precoMax, in: query, schema: { type: number } }
        - { name: bio, in: query, schema: { type: boolean } }
        - { name: epoca, in: query, description: 'Uma ou mais épocas separadas por vírgula (ex. Outono,Inverno)', schema: { type: string } }
        - { name: produtor, in: query, description: Id do produtor, schema: { type: string } }
        - { name: ordem, in: query, schema: { type: string, enum: [nome, preco, '-preco', recentes] } }
      responses:
        '200':
          description: Lista de produtos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }
    post:
      tags: [Produtos]
      summary: Criar produto (produtor)
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201': { description: Produto criado (cabeçalho Location com o endereço do novo produto) }
        '400': { description: Dados inválidos }
        '401': { description: Token em falta ou inválido }
        '403': { description: Utilizador não é produtor }
  /products/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Produtos]
      summary: Detalhe de um produto
      responses:
        '200':
          description: Produto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { description: Identificador inválido }
        '404': { description: Não encontrado }
    put:
      tags: [Produtos]
      summary: Atualizar produto (só o produtor dono)
      security: [ { bearerAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200': { description: Produto atualizado }
        '400': { description: Dados inválidos }
        '401': { description: Token em falta ou inválido }
        '404': { description: Não encontrado (ou não pertence a este produtor) }
    delete:
      tags: [Produtos]
      summary: Remover produto (só o produtor dono)
      security: [ { bearerAuth: [] } ]
      responses:
        '204': { description: Removido }
        '401': { description: Token em falta ou inválido }
        '404': { description: Não encontrado (ou não pertence a este produtor) }
  /producers:
    get:
      tags: [Produtores]
      summary: Listar produtores validados
      parameters:
        - { name: localidade, in: query, schema: { type: string }, example: Ponte de Lima }
      responses:
        '200':
          description: Lista de produtores
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Produtor' }
  /producers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Produtores]
      summary: Página pública do produtor (dados, produtos e avaliação média)
      responses:
        '200':
          description: Produtor com os seus produtos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaProdutor' }
        '400': { description: Identificador inválido }
        '404': { description: Produtor não encontrado }
  /orders:
    post:
      tags: [Encomendas]
      summary: Criar encomenda (comprador). É criada uma encomenda por produtor.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EncomendaInput' }
      responses:
        '201':
          description: Encomendas criadas (uma por produtor)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Encomenda' }
        '400': { description: Dados inválidos }
        '401': { description: Token em falta ou inválido }
        '403': { description: Utilizador não é comprador }
        '409': { description: Stock insuficiente }
    get:
      tags: [Encomendas]
      summary: Listar as encomendas do utilizador (feitas, se comprador; recebidas, se produtor)
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Lista de encomendas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Encomenda' }
        '401': { description: Token em falta ou inválido }
  /orders/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Encomendas]
      summary: Detalhe de uma encomenda (comprador, produtor dela ou admin)
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Encomenda
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Encomenda' }
        '401': { description: Token em falta ou inválido }
        '404': { description: Não encontrada }
  /orders/{id}/estado:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Encomendas]
      summary: Avançar o estado da encomenda (produtor dela). Notifica o comprador em tempo real.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { type: string, enum: [confirmada, pronta, entregue], example: confirmada }
      responses:
        '200': { description: Estado atualizado }
        '400': { description: Estado inválido ou a recuar }
        '401': { description: Token em falta ou inválido }
        '403': { description: Utilizador não é produtor }
        '404': { description: Não encontrada (ou não é deste produtor) }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Erro:
      type: object
      properties:
        erro: { type: string, example: Produto não encontrado }
    Login:
      type: object
      required: [email, password]
      properties:
        email: { type: string, example: horta@exemplo.pt }
        password: { type: string, example: password123 }
    Registo:
      type: object
      required: [nome, email, password]
      properties:
        nome: { type: string, example: Quinta do Vale }
        email: { type: string, example: quinta@exemplo.pt }
        password: { type: string, minLength: 8, example: password123 }
        papel: { type: string, enum: [comprador, produtor], example: produtor }
        produtor:
          type: object
          properties:
            nomeExploracao: { type: string, example: Quinta do Vale }
            localidade: { type: string, example: Caminha }
            descricao: { type: string, example: Hortícolas biológicos junto ao rio Minho. }
    Utilizador:
      type: object
      properties:
        _id: { type: string }
        nome: { type: string }
        email: { type: string }
        papel: { type: string, enum: [comprador, produtor, admin] }
    RespostaLogin:
      type: object
      properties:
        token: { type: string, description: JWT a enviar no cabeçalho Authorization (Bearer) }
        utilizador: { $ref: '#/components/schemas/Utilizador' }
    ProductInput:
      type: object
      required: [nome, categoria, preco]
      properties:
        nome: { type: string, example: Castanha longal }
        categoria: { type: string, enum: [Hortícolas, Fruta, Mel, Vinho, Queijo, Padaria, Outros], example: Outros }
        preco: { type: number, example: 4.5 }
        unidade: { type: string, example: kg }
        stock: { type: integer, example: 120 }
        biologico: { type: boolean, example: false }
        epocas:
          type: array
          items: { type: string, enum: [Primavera, Verão, Outono, Inverno] }
          example: [Outono]
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          properties:
            _id: { type: string }
            produtor: { type: object, description: Produtor (nome e localidade) }
            imagemUrl: { type: string }
    Produtor:
      type: object
      properties:
        _id: { type: string }
        nome: { type: string, example: Horta da Ribeira }
        produtor:
          type: object
          properties:
            nomeExploracao: { type: string }
            localidade: { type: string }
            descricao: { type: string }
            validado: { type: boolean }
    PaginaProdutor:
      type: object
      properties:
        produtor: { $ref: '#/components/schemas/Produtor' }
        produtos:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        avaliacaoMedia: { type: number, nullable: true, example: 4.8 }
        numAvaliacoes: { type: integer, example: 12 }
    EncomendaInput:
      type: object
      required: [linhas]
      properties:
        linhas:
          type: array
          items:
            type: object
            required: [produto, quantidade]
            properties:
              produto: { type: string, description: Id do produto, example: COLE-AQUI-O-ID-DE-UM-PRODUTO }
              quantidade: { type: integer, minimum: 1, example: 2 }
        entrega:
          type: object
          properties:
            tipo: { type: string, enum: [levantamento, entrega], example: levantamento }
            morada: { type: string, description: Obrigatória se tipo = entrega }
    Encomenda:
      type: object
      properties:
        _id: { type: string }
        comprador: { type: object }
        produtor: { type: object }
        linhas:
          type: array
          items:
            type: object
            properties:
              produto: { type: string }
              nome: { type: string }
              precoUnit: { type: number }
              quantidade: { type: integer }
        total: { type: number }
        estado: { type: string, enum: [pendente, confirmada, pronta, entregue] }
        historico:
          type: array
          items:
            type: object
            properties:
              estado: { type: string }
              em: { type: string, format: date-time }
        entrega:
          type: object
          properties:
            tipo: { type: string }
            morada: { type: string }
        createdAt: { type: string, format: date-time }